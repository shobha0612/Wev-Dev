<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>ID Card Form</title>
</head>
<body>

    <!-- Input Form -->
    <div class="form-container">
        <h2>Enter Your Details</h2>
        <form id="idForm">
            <label for="name">Name:</label>
            <input type="text" id="name" required><br><br>

            <label for="faculty">Faculty:</label>
            <input type="text" id="faculty" required><br><br>

            <label for="bn">BN Number:</label>
            <input type="text" id="bn" required><br><br>

            <label for="image">Image URL:</label>
            <input type="text" id="image" placeholder="Paste image URL"><br><br>

            <button type="submit">Generate ID Card</button>
        </form>
    </div>

    <!-- ID Card (Initially Hidden) -->
    <div class="identity" id="idCard" style="display: none;">
        <div class="wrap-identity-content">
            <div class="identity-content" id="idDetails">
                <!-- Populated by JS -->
            </div>
            <div class="icon">
                <a href="#" class="Instagram">Instagram</a>
                <a href="#" class="Facebook">Facebook</a>
                <a href="#" class="Linkedin">LinkedIn</a>
            </div>
        </div>
        <div class="identity-media">
            <img id="idImage" src="" alt="nothing">
        </div>
    </div>

    <script src="form.js"></script>
</body>
</html>
